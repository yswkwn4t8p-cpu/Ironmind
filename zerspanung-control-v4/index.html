let state=load(),view='dashboard',mode='week',anchor=new Date('2026-09-18'),active=null,tab='overview';const $=s=>document.querySelector(s),root=$('#root');function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem(STORE))||clone(seed)}catch{return clone(seed)}}function save(){localStorage.setItem(STORE,JSON.stringify(state));$('#saved').textContent='gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}function machine(id){return M.find(x=>x.id===id)}function dur(j){return(+j.setup)+(+j.cycle)*(+j.qty)}function fmtMin(v){v=Math.round(v);return v>=60?Math.floor(v/60)+' h '+(v%60?String(v%60).padStart(2,'0')+' min':''):v+' min'}function fmtDate(v){return v?new Date(v+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—'}function fmtDT(v){return v?new Date(v).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}function finish(j){return j.start?new Date(new Date(j.start).getTime()+dur(j)*60000):null}function late(j){let f=finish(j);return !!(f&&j.due&&f>new Date(j.due+'T16:00'))}function status(s){return({planned:'Geplant',unplanned:'Ungeplant',setup:'Rüsten',running:'Läuft',paused:'Pause',done:'Fertig'})[s]||s}function badge(s){return s==='running'||s==='done'?'green':s==='setup'||s==='paused'?'orange':s==='planned'?'blue':'red'}function monday(d){let x=new Date(d),n=x.getDay()||7;x.setDate(x.getDate()-n+1);x.setHours(0,0,0,0);return x}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function iso(d){return d.toISOString().slice(0,10)}

function dashboard(){let open=state.jobs.filter(j=>j.status!=='done'),unp=open.filter(j=>!j.m||!j.start).length,ln=open.filter(late).length,total=open.reduce((s,j)=>s+dur(j),0);let machines=M.map(m=>{let q=open.filter(j=>j.m===m.id).sort((a,b)=>(a.start||'9').localeCompare(b.start||'9')),j=q[0];return `<div class="machine"><div class="head"><div><h3>${m.name}</h3><span class="tiny muted">${q.length} offene Aufträge</span></div>${j?`<span class="badge ${badge(j.status)}">${status(j.status)}</span>`:'<span class="badge green">Frei</span>'}</div>${j?`<div class="list" onclick="openJob('${j.id}')"><div><b>${j.id} · ${j.name}</b><small>${fmtDT(j.start)} · ${j.good}/${j.qty} Gutteile</small></div></div>`:'<div class="muted tiny">Keine Arbeit eingeplant</div>'}</div>`}).join('');let due=[...open].sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6).map(j=>`<div class="list" onclick="openJob('${j.id}')"><div><b>${j.id} · ${j.name}</b><small>${machine(j.m)?.name||'ungeplant'} · ${j.qty} Stk.</small></div><span class="badge ${late(j)?'red':''}">${fmtDate(j.due)}</span></div>`).join('');root.innerHTML=`<div class="kpis"><div class="kpi"><small>Offene Aufträge</small><strong>${open.length}</strong></div><div class="kpi"><small>Maschinen</small><strong>4</strong></div><div class="kpi"><small>Ungeplant</small><strong>${unp}</strong></div><div class="kpi"><small>Terminrisiken</small><strong>${ln}</strong></div><div class="kpi"><small>Offene Zeit</small><strong>${fmtMin(total)}</strong></div></div><div class="grid2"><section class="panel"><div class="head"><h2>Maschinenstatus</h2><button class="btn small" onclick="show('planner')">Zeitplan öffnen</button></div><div class="machinegrid">${machines}</div></section><section class="panel"><div class="head"><h2>Nächste Liefertermine</h2></div>${due}</section></div><div class="modules"><div class="module" onclick="show('planner')"><div>▤</div><h3>Zeitplanung</h3><p>Alle Maschinen auf einem Zeitstrahl. Balken anklicken und Auftrag direkt öffnen.</p></div><div class="module" onclick="show('orders')"><div>☷</div><h3>Fertigungsaufträge</h3><p>Alle Aufträge mit Material, Termin, Maschine und Status. Volltextsuche inklusive.</p></div><div class="module" onclick="openJob('FA-260191')"><div>🛠</div><h3>Digitale Auftragsmappe</h3><p>Aufspannung, Werkzeuge, Aufnahmen, NC-Programm, Zeichnung und Prüfung in einer Ansicht.</p></div></div>`}
function planner(){let b=mode==='week'?monday(anchor):new Date(anchor),days=mode==='week'?5:1,shift=600,width=mode==='week'?1450:950,ppm=width/(shift*days),axis='';for(let d=0;d<days;d++){let day=add(b,d),left=d*shift*ppm,w=shift*ppm,lines='';for(let h=6;h<=16;h++){let x=(d*shift+(h-6)*60)*ppm;lines+=`<span class="line" style="left:${x}px"></span>${h<16?`<span class="hour" style="left:${x}px">${String(h).padStart(2,'0')}:00</span>`:''}`};axis+=`<div class="day" style="left:${left}px;width:${w}px"><div class="dayname">${day.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}</div></div>${lines}`}let unp=state.jobs.filter(j=>j.status!=='done'&&(!j.m||!j.start)).map(j=>`<div onclick="openJob('${j.id}')"><b>${j.id} · ${j.name}</b><small>${j.qty} Stk. · ${fmtMin(dur(j))}</small></div>`).join('');let rows=M.map(m=>{let js=state.jobs.filter(j=>j.m===m.id&&j.start&&j.status!=='done'),bars=js.map(j=>bar(j,b,days,ppm)).join(''),load=js.reduce((s,j)=>s+dur(j),0),pct=Math.min(100,Math.round(load/(shift*days)*100)),div='';for(let i=1;i<days;i++)div+=`<span class="divider" style="left:${i*shift*ppm}px"></span>`;return `<div class="mrow"><div class="sticky mlabel"><b>${m.name}</b><small>${fmtMin(load)} · ${pct}%</small><div class="load"><span style="width:${pct}%"></span></div></div><div class="track" style="width:${width}px">${div}${bars}</div></div>`}).join('');let title=mode==='week'?fmtDate(iso(b))+' – '+fmtDate(iso(add(b,4))):b.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit'});root.innerHTML=`<div class="planner-tools"><div class="seg"><button class="${mode==='day'?'on':''}" onclick="setMode('day')">Tag</button><button class="${mode==='week'?'on':''}" onclick="setMode('week')">Woche</button></div><div class="datebar"><button class="btn small" onclick="moveWeek(-1)">‹</button><strong>${title}</strong><button class="btn small" onclick="moveWeek(1)">›</button></div></div><div class="legend"><span><i style="background:#e08a00"></i>Rüstzeit</span><span><i style="background:#2563eb"></i>Laufzeit</span><span><i style="background:#ef4444"></i>Termin kritisch</span><span>Balken anklicken → Auftrag öffnen</span></div>${unp?`<div class="unplanned">${unp}</div>`:''}<div class="timeline"><div class="scroll"><div class="tlhead"><div class="sticky">Maschine / Auslastung</div><div class="axis" style="width:${width}px">${axis}</div></div>${rows}</div></div>`}
function bar(j,b,days,ppm){let s=new Date(j.start),day=Math.floor((new Date(s.getFullYear(),s.getMonth(),s.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);if(day<0||day>=days)return'';let left=(day*600+(s.getHours()-6)*60+s.getMinutes())*ppm,w=Math.max(28,dur(j)*ppm),sp=Math.min(100,j.setup/dur(j)*100);return `<div class="bar ${late(j)?'late':''}" style="left:${left}px;width:${w}px" onclick="openJob('${j.id}')"><div class="fill"><div class="setup" style="width:${sp}%"></div><div class="run"></div></div><div class="bartext"><b>${j.id}</b><small>${j.name} · ${j.qty} Stk.</small></div></div>`}function setMode(m){mode=m;planner()}function moveWeek(n){anchor=add(anchor,n*(mode==='week'?7:1));planner()}
function orders(){let rows=state.jobs.map(j=>`<tr onclick="openJob('${j.id}')"><td><b>${j.id}</b></td><td>${j.article}</td><td>${j.name}</td><td>${j.qty}</td><td>${j.material}</td><td>${machine(j.m)?.name||'offen'}</td><td>${fmtDT(j.start)}</td><td>${fmtDate(j.due)}</td><td><span class="badge ${badge(j.status)}">${status(j.status)}</span></td></tr>`).join('');root.innerHTML=`<div class="toolbar"><input id="search" class="search" placeholder="Auftrag, Artikel oder Bezeichnung suchen…"><button class="btn primary" onclick="newOrder()">+ Auftrag</button></div><div class="tablewrap"><table class="orders"><thead><tr><th>Auftrag</th><th>Artikel</th><th>Bezeichnung</th><th>Stk.</th><th>Material</th><th>Maschine</th><th>Start</th><th>Termin</th><th>Status</th></tr></thead><tbody id="tbody">${rows}</tbody></table></div>`;$('#search').oninput=e=>document.querySelectorAll('#tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')}
function openJob(id,t='overview'){active=id;tab=t;renderSheet();$('#backdrop').classList.remove('hidden')}function closeSheet(){$('#backdrop').classList.add('hidden')}function jobTab(t){tab=t;renderSheet()}function renderSheet(){let j=state.jobs.find(x=>x.id===active),tabs=[['overview','Übersicht'],['planning','Planung'],['fixture','Aufspannung'],['tools','Werkzeuge'],['docs','Programm & Zeichnung'],['quality','Prüfung']];$('#sheet').innerHTML=`<div class="sheethead"><div><span class="ey">Fertigungsauftrag</span><h2>${j.id} · ${j.name}</h2><span class="badge ${badge(j.status)}">${status(j.status)}</span> <span class="badge">${machine(j.m)?.name||'Maschine offen'}</span></div><button class="close" onclick="closeSheet()">×</button></div><div class="tabs">${tabs.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="jobTab('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="sheetbody">${tabContent(j)}</div>`}function tabContent(j){if(tab==='overview')return `<div class="overview"><div><div class="sub"><h3>Auftragsübersicht</h3><div class="infogrid"><div class="info"><small>Artikel</small><b>${j.article}</b></div><div class="info"><small>Stückzahl</small><b>${j.qty}</b></div><div class="info"><small>Material</small><b>${j.material||'—'}</b></div><div class="info"><small>Liefertermin</small><b>${fmtDate(j.due)}</b></div><div class="info"><small>Rüstzeit</small><b>${j.setup} min</b></div><div class="info"><small>Laufzeit</small><b>${j.cycle} min/Stk.</b></div></div></div><div class="sub"><h3>Direkt zu</h3><div class="quicklinks"><div class="quick" onclick="jobTab('fixture')"><b>Aufspannung</b><small>${j.fixture||'noch offen'}</small></div><div class="quick" onclick="jobTab('tools')"><b>Werkzeuge</b><small>${j.tools.length} hinterlegt</small></div><div class="quick" onclick="jobTab('docs')"><b>Programm / Zeichnung</b><small>${j.program||'noch offen'}</small></div><div class="quick" onclick="jobTab('quality')"><b>Prüfung</b><small>${j.inspection||'noch offen'}</small></div><div class="quick" onclick="jobTab('planning')"><b>Planung</b><small>${fmtDT(j.start)}</small></div></div></div></div><div><div class="sub"><h3>Rüstbereitschaft</h3>${checks(j)}</div></div></div>`;if(tab==='planning')return `<div class="sub"><h3>Planung</h3><div class="infogrid"><div class="info"><small>Maschine</small><b>${machine(j.m)?.name||'offen'}</b></div><div class="info"><small>Start</small><b>${fmtDT(j.start)}</b></div><div class="info"><small>Gesamtdauer</small><b>${fmtMin(dur(j))}</b></div><div class="info"><small>Liefertermin</small><b>${fmtDate(j.due)}</b></div></div></div>`;if(tab==='fixture')return `<div class="sub"><h3>Aufspannung</h3><div class="infogrid"><div class="info"><small>Spannmittel</small><b>${j.fixture||'—'}</b></div><div class="info"><small>Rohteil</small><b>${j.blank||'—'}</b></div><div class="info"><small>Nullpunkt</small><b>${j.zero||'—'}</b></div></div><p class="tiny muted">${j.note||'Noch keine Rüsthinweise hinterlegt.'}</p></div>`;if(tab==='tools')return `<div class="sub"><div class="head"><h3>Werkzeuge & Aufnahmen</h3><button class="btn primary small" onclick="addTool('${j.id}')">+ Werkzeug</button></div><div style="overflow:auto"><table class="tooltable"><thead><tr><th>Platz</th><th>Werkzeug</th><th>Aufnahme</th><th>Ø</th><th>Auskragung</th><th>Verwendung</th></tr></thead><tbody>${j.tools.map(t=>`<tr>${t.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="6">Noch keine Werkzeuge hinterlegt.</td></tr>'}</tbody></table></div></div>`;if(tab==='docs')return `<div class="sub"><h3>Programm & Zeichnung</h3><div class="infogrid"><div class="info"><small>NC-Programm</small><b>${j.program||'—'}</b></div><div class="info"><small>Zeichnung</small><b>${j.drawing||'—'}</b></div><div class="info"><small>Material</small><b>${j.material||'—'}</b></div></div></div>`;return `<div class="sub"><h3>Prüfung & Freigabe</h3><p class="tiny">${j.inspection||'Noch keine Prüfmittel hinterlegt.'}</p>${checks(j)}</div>`}function checks(j){return Object.entries(j.check).map(([k,v])=>`<div class="check"><input type="checkbox" ${v?'checked':''} onchange="toggleCheck('${j.id}','${k}',this.checked)"><span>${({fixture:'Spannmittel vorbereitet',zero:'Nullpunkt festgelegt',tools:'Werkzeuge vorbereitet',program:'NC-Programm bereit',first:'Erstteil freigegeben'})[k]}</span></div>`).join('')}function toggleCheck(id,k,v){let j=state.jobs.find(x=>x.id===id);j.check[k]=v;save()}function addTool(id){let j=state.jobs.find(x=>x.id===id),p=prompt('Werkzeugplatz:','T07');if(!p)return;j.tools.push([p,prompt('Werkzeug:','VHM Fräser Ø10')||'',prompt('Aufnahme:','SK40 Schrumpf')||'',prompt('Ø mm:','10')||'',prompt('Auskragung mm:','30')||'',prompt('Verwendung:','Schruppen')||'']);j.check.tools=true;save();renderSheet()}function newOrder(){let id=prompt('Auftragsnummer:','FA-260300');if(!id)return;state.jobs.push({id,article:'',name:prompt('Bezeichnung:','Neuer Auftrag')||'Neuer Auftrag',qty:10,due:'2026-09-30',m:'',setup:20,cycle:5,start:'',status:'unplanned',good:0,material:'',program:'',drawing:'',fixture:'',zero:'',blank:'',note:'',inspection:'',tools:[],check:{fixture:false,zero:false,tools:false,program:false,first:false}});save();openJob(id)}window.show=show;window.openJob=openJob;window.closeSheet=closeSheet;window.jobTab=jobTab;window.setMode=setMode;window.moveWeek=moveWeek;window.newOrder=newOrder;window.toggleCheck=toggleCheck;window.addTool=addTool;render();save();
</script></body></html>
