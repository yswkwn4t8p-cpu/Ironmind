<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e2e8f0;--nav:#0f172a;--blue:#2563eb;--orange:#f59e0b;--green:#16a34a;--red:#dc2626;--label:190px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{height:100vh;position:sticky;top:0;background:var(--nav);color:#dbe4f0;padding:18px 12px;z-index:30}.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}.logo{width:39px;height:39px;border-radius:11px;background:var(--blue);display:grid;place-items:center;color:white;font-weight:900}.brand b{display:block}.brand small{font-size:10px;color:#94a3b8}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:11px 12px;border-radius:9px;font-weight:750;cursor:pointer}.nav button.on,.nav button:hover{background:#1e293b;color:#fff}.side-foot{position:absolute;bottom:18px;left:20px;right:20px;border-top:1px solid #334155;padding-top:12px;font-size:10px;color:#94a3b8}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:6px}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.topbar h1{margin:1px 0;font-size:21px}.eyebrow{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.topactions{display:flex;gap:8px}.content{padding:18px;max-width:1700px;margin:auto}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;font-size:11px;margin-bottom:13px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 11px;font-weight:750;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.success{background:#ecfdf3;color:#087443;border-color:#bbefd0}.btn.danger{background:#fff1f2;color:#b42318;border-color:#fecdd3}.btn.small{font-size:10px;padding:6px 8px}.mobile-menu{display:none}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:13px}.kpi,.panel,.machine-card,.tablewrap,.settings-card{background:white;border:1px solid var(--line);border-radius:12px}.kpi{padding:14px}.kpi small{color:var(--muted);font-size:10px}.kpi strong{display:block;font-size:26px;margin-top:5px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.panel{padding:15px}.panel h2{font-size:14px;margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}.machine-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.machine-card{padding:12px;background:#fbfcfe}.machine-card h3{font-size:12px;margin:0 0 3px}.muted{color:var(--muted)}.tiny{font-size:10px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2f7;font-size:9px;font-weight:850;white-space:nowrap}.badge.blue{background:#eaf1ff;color:#174ea6}.badge.green{background:#eaf8ef;color:#106a31}.badge.orange{background:#fff4e5;color:#9a5700}.badge.red{background:#fff0f0;color:#a61b1b}.list-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}.list-row:last-child{border:0}.list-row b{font-size:11px}.list-row small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.planner-tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.seg{display:flex;gap:3px;background:#e9eef6;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:10px;font-weight:800;cursor:pointer}.seg button.on{background:white;box-shadow:0 1px 3px #0002}.date-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.date-title{min-width:170px;text-align:center;font-weight:850;font-size:11px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:9px;color:var(--muted);margin:7px 0 10px}.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}.unplanned{display:flex;gap:7px;overflow:auto;padding:0 0 10px}.unplanned-card{min-width:210px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:9px;padding:9px;cursor:pointer}.unplanned-card b{display:block;font-size:10px}.unplanned-card small{font-size:9px;color:var(--muted)}.timeline-shell{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.timeline-scroll{overflow:auto;max-height:650px;position:relative}.tl-header,.machine-row{display:flex;min-width:max-content}.tl-left{width:var(--label);min-width:var(--label);position:sticky;left:0;z-index:7;background:#fff;border-right:1px solid var(--line)}.tl-header .tl-left{z-index:12;background:#f8fafc;border-bottom:1px solid var(--line);padding:10px 11px;font-size:10px;font-weight:850}.axis{height:58px;position:relative;background:#f8fafc;border-bottom:1px solid var(--line)}.day-block{position:absolute;top:0;height:100%;border-right:2px solid #cbd5e1}.day-name{height:28px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:850;border-bottom:1px solid var(--line)}.hour-label{position:absolute;top:34px;transform:translateX(-50%);font-size:8px;color:var(--muted)}.hour-line{position:absolute;top:0;bottom:0;border-left:1px solid #e7ebf2}.machine-row{min-height:92px;border-bottom:1px solid var(--line)}.machine-row:last-child{border-bottom:0}.machine-label{padding:11px}.machine-label b{display:block;font-size:11px}.machine-label small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.load{height:5px;background:#e8edf4;border-radius:99px;margin-top:8px;overflow:hidden}.load span{display:block;height:100%;background:var(--blue);border-radius:99px}.track{height:92px;position:relative;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--hourw) - 1px),#edf1f6 calc(var(--hourw) - 1px),#edf1f6 var(--hourw));background-color:#fff}.track.dragover{background-color:#eff6ff}.day-divider{position:absolute;top:0;bottom:0;border-left:2px solid #cbd5e1;pointer-events:none}.bar{position:absolute;top:15px;height:61px;border-radius:8px;border:1px solid #bfcee4;box-shadow:0 1px 2px #0001;overflow:hidden;cursor:grab;min-width:18px;color:#fff}.bar:active{cursor:grabbing}.bar.late{outline:2px solid #ef4444;outline-offset:1px}.bar.done{opacity:.55}.bar-fill{position:absolute;inset:0;display:flex}.bar-setup{background:#d97706;height:100%}.bar-run{background:#2563eb;height:100%;flex:1}.bar-text{position:relative;z-index:2;padding:6px 7px;text-shadow:0 1px 1px #0007;white-space:nowrap;overflow:hidden}.bar-text b{display:block;font-size:9px}.bar-text small{display:block;font-size:8px;margin-top:2px}.now-line{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:4;pointer-events:none}.now-line:before{content:'Jetzt';position:absolute;top:0;left:3px;color:#ef4444;font-size:8px;font-weight:900}.planner-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.summary-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.summary-card b{font-size:10px}.summary-card strong{display:block;font-size:18px;margin-top:3px}.tablewrap{overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.search{border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:260px}.orders-table{width:100%;border-collapse:collapse;min-width:980px}.orders-table th,.orders-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:10px}.orders-table th{background:#f8fafc;color:var(--muted);font-size:9px;text-transform:uppercase}.orders-table tr{cursor:pointer}.orders-table tr:hover td{background:#fafcff}.tablet-wrap{max-width:1050px;margin:auto}.machine-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.hero{background:#0f172a;color:#fff;border-radius:15px;padding:18px}.hero h2{font-size:21px;margin:5px 0}.tablet-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:11px;margin-top:11px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.info{border:1px solid var(--line);border-radius:9px;padding:9px}.info small{display:block;color:var(--muted);font-size:9px}.info b{font-size:11px}.shop-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.shop-actions .btn{min-height:47px}.qty{font-size:29px;font-weight:900}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.settings-card{padding:14px}.field{display:grid;gap:4px;margin-bottom:9px}.field label{font-size:9px;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.backdrop{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:14px;z-index:60}.hidden{display:none}.modal{background:#fff;width:min(760px,96vw);max-height:92vh;overflow:auto;border-radius:14px}.modal-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:15px 17px;border-bottom:1px solid var(--line)}.modal-head b{font-size:14px}.modal-body{padding:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.close{border:0;background:transparent;font-size:21px;cursor:pointer}.empty{padding:22px;text-align:center;color:var(--muted);font-size:10px}.hint{font-size:9px;color:var(--muted);margin-top:5px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.tablet-grid{grid-template-columns:1fr}.planner-summary{grid-template-columns:1fr 1fr}}@media(max-width:760px){:root{--label:145px}.app{display:block}.sidebar{position:fixed;left:-250px;width:235px;transition:.2s;box-shadow:8px 0 25px #0002}.sidebar.open{left:0}.mobile-menu{display:inline-block}.topbar{height:65px;padding:0 10px}.topbar h1{font-size:17px}.topactions .desktop-only{display:none}.content{padding:10px}.kpis{grid-template-columns:1fr 1fr}.machine-grid,.settings-grid,.info-grid{grid-template-columns:1fr}.planner-tools{align-items:flex-start}.date-title{min-width:130px}.planner-summary{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.timeline-scroll{max-height:560px}.shop-actions{grid-template-columns:1fr 1fr}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">ZC</div><div><b>Zerspanung Control</b><small>Privater Planungs-Test</small></div></div>
  <div class="nav" id="nav">
    <button data-v="dashboard" class="on">▦ Dashboard</button>
    <button data-v="planner">▤ Zeitplanung</button>
    <button data-v="orders">☷ Fertigungsaufträge</button>
    <button data-v="tablet">▣ Maschinenansicht</button>
    <button data-v="settings">⚙ Einstellungen</button>
  </div>
  <div class="side-foot"><span class="live-dot"></span>lokaler Teststand<br><span id="saveState">noch nicht gespeichert</span></div>
</aside>
<main class="main">
  <header class="topbar">
    <button class="btn mobile-menu" id="menuBtn">☰</button>
    <div><span class="eyebrow">Zerspanung</span><h1 id="title">Dashboard</h1></div>
    <div class="topactions"><button class="btn desktop-only" onclick="showView('planner')">Zeitplan</button><button class="btn primary" onclick="openNewOrder()">+ Auftrag</button></div>
  </header>
  <div class="content"><div class="notice"><b>Privater Testmodus:</b> Daten werden nur in diesem Browser gespeichert. Für echte Firmendaten kommt später eine zentrale Datenbank bzw. SharePoint-Anbindung dazu.</div><div id="root"></div></div>
</main>
</div>
<div class="backdrop hidden" id="backdrop"><div class="modal" id="modal"></div></div>
<script>
const MACHINES=[
 {id:'M01',name:'Haas 5-Achs',type:'5-Achs Fräsen',note:'Komplexteile / 5-Seiten'},
 {id:'M02',name:'Haas 3-Achs',type:'3-Achs Fräsen',note:'Platten / Standardfräsen'},
 {id:'M03',name:'Kern Drehen',type:'Drehen',note:'Präzisions-Drehteile'},
 {id:'M04',name:'Haas Y-Achs',type:'Dreh-Fräsen',note:'Komplettbearbeitung'}
];
const STORE='zc-gantt-v3';
const DEFAULT_SETTINGS={shiftStart:6,shiftEnd:16,snap:15};
let state=loadState();
let view='dashboard';
let plannerMode='week';
let anchor=new Date();
let selectedMachine='M01';
let zoom=0.55;
let dragId='';
const root=document.getElementById('root');
const $=s=>document.querySelector(s);
function pad(n){return String(n).padStart(2,'0')}
function dateISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function localDT(d){return dateISO(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function parseDT(s){return new Date(s)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){let x=new Date(d);x.setHours(0,0,0,0);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function nextWorkDay(d){let x=addDays(d,1);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);x.setHours(state.settings.shiftStart,0,0,0);return x}
function normalizeWork(d){let x=new Date(d),ss=state.settings.shiftStart,se=state.settings.shiftEnd;if(x.getDay()===0){x=addDays(x,1);x.setHours(ss,0,0,0)}if(x.getDay()===6){x=addDays(x,2);x.setHours(ss,0,0,0)}let mins=x.getHours()*60+x.getMinutes();if(mins<ss*60)x.setHours(ss,0,0,0);if(mins>=se*60)x=nextWorkDay(x);return x}
function addBusinessMinutes(start,minutes){let x=normalizeWork(start),remain=Math.max(0,+minutes||0),ss=state.settings.shiftStart,se=state.settings.shiftEnd;while(remain>0){let end=new Date(x);end.setHours(se,0,0,0);let avail=(end-x)/60000;if(remain<=avail){x=new Date(x.getTime()+remain*60000);remain=0}else{remain-=avail;x=nextWorkDay(x)}}return x}
function businessDayDiff(base,date){let b=new Date(base);b.setHours(0,0,0,0);let d=new Date(date);d.setHours(0,0,0,0);if(+b===+d)return 0;let dir=d>b?1:-1,count=0,x=new Date(b);while((dir>0&&x<d)||(dir<0&&x>d)){x=addDays(x,dir);if(x.getDay()!==0&&x.getDay()!==6)count+=dir}return count}
function dayIndexToDate(base,idx){let x=new Date(base),left=idx;if(left>=0){while(left>0){x=addDays(x,1);if(x.getDay()!==0&&x.getDay()!==6)left--}}else{while(left<0){x=addDays(x,-1);if(x.getDay()!==0&&x.getDay()!==6)left++}}return x}
function duration(j){return (+j.setup||0)+(+j.cycle||0)*(+j.qty||0)}
function dueEnd(j){let d=new Date(j.due+'T00:00:00');d.setHours(state.settings.shiftEnd,0,0,0);return d}
function finishDate(j){return j.start?addBusinessMinutes(parseDT(j.start),duration(j)):null}
function isLate(j){let f=finishDate(j);return !!(f&&j.due&&f>dueEnd(j))}
function priorityRank(p){return p==='high'?0:p==='medium'?1:2}
function suggestMachine(j){let s=((j.type||'')+' '+(j.name||'')).toLowerCase();if(s.includes('5-achs')||s.includes('5 achs'))return'M01';if(s.includes('dreh-fr')||s.includes('y-achs')||s.includes('komplett'))return'M04';if(s.includes('dreh'))return'M03';return'M02'}
function seedState(){let start=normalizeWork(new Date()),d0=new Date(start);let starts=[d0,addBusinessMinutes(d0,60),addBusinessMinutes(d0,120),d0,addBusinessMinutes(d0,250)];let due=n=>dateISO(addDays(d0,n));return {settings:clone(DEFAULT_SETTINGS),jobs:[
 {id:'FA-260184',article:'A-18420',name:'Welle Antrieb',type:'Dreh-Fräsen',qty:10,due:due(1),m:'M04',setup:30,cycle:7,status:'planned',good:0,priority:'high',start:localDT(starts[0]),material:'1.4301 Ø50',program:'260184_OP10.NC'},
 {id:'FA-260191',article:'A-19110',name:'Halter Sensor',type:'5-Achs',qty:8,due:due(2),m:'M01',setup:35,cycle:11,status:'planned',good:0,priority:'medium',start:localDT(starts[1]),material:'AlMgSi1',program:'260191_OP10.NC'},
 {id:'FA-260205',article:'A-20502',name:'Distanzplatte',type:'3-Achs',qty:20,due:due(3),m:'M02',setup:20,cycle:4,status:'planned',good:0,priority:'medium',start:localDT(starts[2]),material:'Aluminium',program:'260205_OP10.NC'},
 {id:'FA-260211',article:'A-21104',name:'Bolzen Präzision',type:'Drehen',qty:12,due:due(3),m:'M03',setup:25,cycle:5.5,status:'planned',good:0,priority:'low',start:localDT(starts[3]),material:'42CrMo4',program:'260211_OP10.NC'},
 {id:'FA-260219',article:'A-21911',name:'Aufnahmeblock',type:'Fräsen',qty:6,due:due(2),m:'',setup:30,cycle:12,status:'unplanned',good:0,priority:'high',start:'',material:'1.1730',program:''},
 {id:'FA-260226',article:'A-22615',name:'Flansch Deckel',type:'5-Achs',qty:15,due:due(4),m:'M01',setup:28,cycle:8,status:'planned',good:0,priority:'medium',start:localDT(starts[4]),material:'Aluminium',program:'260226_OP10.NC'}
 ]}}
function loadState(){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&x.jobs){x.settings={...DEFAULT_SETTINGS,...x.settings};return x}let old=JSON.parse(localStorage.getItem('zcprod')||'null');if(old){let s=seedState();s.jobs=old.map(j=>({id:j.id,article:'',name:j.name,type:'Fräsen',qty:j.qty,due:isoFromOldDue(j.due),m:j.m,setup:j.setup,cycle:j.cycle,status:j.status,good:j.good||0,priority:j.p||'medium',start:'',material:'',program:''}));return s}}catch(e){}return seedState()}
function isoFromOldDue(v){let m=String(v||'').match(/(\d{1,2})\.(\d{1,2})/);let y=new Date().getFullYear();return m?`${y}-${pad(m[2])}-${pad(m[1])}`:dateISO(addDays(new Date(),7))}
function save(){localStorage.setItem(STORE,JSON.stringify(state));$('#saveState').textContent='gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function machine(id){return MACHINES.find(m=>m.id===id)}
function statusText(s){return({unplanned:'Ungeplant',planned:'Geplant',setup:'Rüsten',running:'Läuft',paused:'Pause',done:'Fertig'})[s]||s}
function badgeClass(s){return s==='done'||s==='running'?'green':s==='setup'||s==='paused'?'orange':s==='planned'?'blue':'red'}
function fmtDate(v){if(!v)return'—';return new Date(v+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}
function fmtDT(v){if(!v)return'—';return parseDT(v).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fmtMin(v){v=Math.round(v);return v>=60?Math.floor(v/60)+' h '+(v%60?pad(v%60)+' min':''):v+' min'}
function showView(v){view=v;$('#title').textContent=({dashboard:'Dashboard',planner:'Zeitplanung',orders:'Fertigungsaufträge',tablet:'Maschinenansicht',settings:'Einstellungen'})[v];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#sidebar').classList.remove('open');render()}
$('#nav').onclick=e=>{let b=e.target.closest('button');if(b)showView(b.dataset.v)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
function render(){if(view==='dashboard')renderDashboard();if(view==='planner')renderPlanner();if(view==='orders')renderOrders();if(view==='tablet')renderTablet();if(view==='settings')renderSettings()}
function renderDashboard(){let open=state.jobs.filter(j=>j.status!=='done'),active=state.jobs.filter(j=>j.status==='running').length,unplanned=open.filter(j=>!j.m||!j.start).length,late=open.filter(isLate).length,mins=open.reduce((s,j)=>s+duration(j),0);let machineCards=MACHINES.map(m=>{let q=open.filter(j=>j.m===m.id).sort((a,b)=>(a.start||'9').localeCompare(b.start||'9'));let j=q.find(x=>['running','setup','paused'].includes(x.status))||q[0];return `<div class="machine-card"><div class="section-head"><div><h3>${m.name}</h3><span class="tiny muted">${m.note}</span></div>${j?`<span class="badge ${badgeClass(j.status)}">${statusText(j.status)}</span>`:'<span class="badge green">Frei</span>'}</div>${j?`<div class="list-row" onclick="openOrder('${j.id}')"><div><b>${j.id} · ${j.name}</b><small>${fmtDT(j.start)} · ${j.good}/${j.qty} Stk.</small></div></div>`:'<div class="empty">Keine Arbeit eingeplant</div>'}</div>`}).join('');let upcoming=[...open].sort((a,b)=>a.due.localeCompare(b.due)||priorityRank(a.priority)-priorityRank(b.priority)).slice(0,7).map(j=>`<div class="list-row" onclick="openOrder('${j.id}')"><div><b>${j.id} · ${j.name}</b><small>${machine(j.m)?.name||'ungeplant'} · ${j.qty} Stk.</small></div><div><span class="badge ${isLate(j)?'red':''}">${fmtDate(j.due)}</span></div></div>`).join('');root.innerHTML=`<div class="kpis"><div class="kpi"><small>Offene Aufträge</small><strong>${open.length}</strong></div><div class="kpi"><small>Maschinen aktiv</small><strong>${active}</strong></div><div class="kpi"><small>Noch ungeplant</small><strong>${unplanned}</strong></div><div class="kpi"><small>Terminrisiken</small><strong>${late}</strong></div><div class="kpi"><small>Offene Kapazität</small><strong>${fmtMin(mins)}</strong></div></div><div class="grid2"><section class="panel"><div class="section-head"><h2>Maschinenstatus</h2><button class="btn small" onclick="showView('planner')">Zum Zeitplan</button></div><div class="machine-grid">${machineCards}</div></section><section class="panel"><div class="section-head"><h2>Nächste Liefertermine</h2></div>${upcoming||'<div class="empty">Keine offenen Aufträge</div>'}</section></div>`}
function plannerBase(){return plannerMode==='week'?mondayOf(anchor):(()=>{let d=new Date(anchor);d.setHours(0,0,0,0);return d})()}
function plannerDays(){return plannerMode==='week'?5:1}
function shiftMinutes(){return (state.settings.shiftEnd-state.settings.shiftStart)*60}
function plannerWidth(){return Math.max(plannerMode==='week'?1350:900,plannerDays()*shiftMinutes()*zoom)}
function dateToIndex(dt,base){let d=new Date(dt),diff=businessDayDiff(base,d),mins=d.getHours()*60+d.getMinutes()-state.settings.shiftStart*60;return diff*shiftMinutes()+mins}
function indexToDate(idx,base){let sm=shiftMinutes(),day=Math.floor(idx/sm),rem=idx-day*sm;if(rem<0){day--;rem+=sm}let d=dayIndexToDate(base,day);d.setHours(state.settings.shiftStart,0,0,0);d=new Date(d.getTime()+rem*60000);return normalizeWork(d)}
function renderPlanner(){let base=plannerBase(),days=plannerDays(),sm=shiftMinutes(),total=days*sm,width=plannerWidth(),ppm=width/total,hourw=60*ppm;let title=plannerMode==='week'?`${fmtDate(dateISO(base))} – ${fmtDate(dateISO(dayIndexToDate(base,4)))}`:base.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});let unplanned=state.jobs.filter(j=>j.status!=='done'&&(!j.m||!j.start));let unplannedHtml=unplanned.map(j=>`<div class="unplanned-card" onclick="openOrder('${j.id}')"><b>${j.id} · ${j.name}</b><small>${j.qty} Stk. · ${j.type} · ${fmtMin(duration(j))}</small></div>`).join('');let axis='';for(let d=0;d<days;d++){let day=dayIndexToDate(base,d),left=d*sm*ppm,w=sm*ppm;let hours='';for(let h=state.settings.shiftStart;h<=state.settings.shiftEnd;h++){let x=(d*sm+(h-state.settings.shiftStart)*60)*ppm;hours+=`<span class="hour-line" style="left:${x}px"></span>${h<state.settings.shiftEnd?`<span class="hour-label" style="left:${x}px">${pad(h)}:00</span>`:''}`};axis+=`<div class="day-block" style="left:${left}px;width:${w}px"><div class="day-name">${day.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}</div></div>${hours}`}
 let nowIdx=dateToIndex(new Date(),base),nowLine=nowIdx>=0&&nowIdx<=total?`<span class="now-line" style="left:${nowIdx*ppm}px"></span>`:'';
 let rows=MACHINES.map(m=>{let jobs=state.jobs.filter(j=>j.m===m.id&&j.status!=='done'&&j.start);let bars=jobs.map(j=>barHTML(j,base,total,ppm)).join('');let load=jobs.reduce((s,j)=>{let a=dateToIndex(parseDT(j.start),base),b=a+duration(j),ov=Math.max(0,Math.min(total,b)-Math.max(0,a));return s+ov},0),pct=Math.min(100,Math.round(load/total*100));let dividers='';for(let d=1;d<days;d++)dividers+=`<span class="day-divider" style="left:${d*sm*ppm}px"></span>`;return `<div class="machine-row"><div class="tl-left machine-label"><b>${m.name}</b><small>${fmtMin(load)} · ${pct}% belegt</small><div class="load"><span style="width:${pct}%"></span></div></div><div class="track" data-machine="${m.id}" style="width:${width}px;--hourw:${hourw}px" ondragover="trackOver(event)" ondragleave="trackLeave(event)" ondrop="dropJob(event,'${m.id}')">${dividers}${nowLine}${bars}</div></div>`}).join('');
 let summaries=MACHINES.map(m=>{let q=state.jobs.filter(j=>j.m===m.id&&j.status!=='done'),late=q.filter(isLate).length;return `<div class="summary-card"><b>${m.name}</b><strong>${q.length} AG</strong><span class="tiny ${late?'':'muted'}">${late?late+' Terminrisiko'+(late>1?'s':''):'keine Terminwarnung'}</span></div>`}).join('');
 root.innerHTML=`<div class="planner-tools"><div class="seg"><button class="${plannerMode==='day'?'on':''}" onclick="setPlannerMode('day')">Tag</button><button class="${plannerMode==='week'?'on':''}" onclick="setPlannerMode('week')">Woche</button></div><div class="date-tools"><button class="btn small" onclick="shiftPlanner(-1)">‹</button><div class="date-title">${title}</div><button class="btn small" onclick="shiftPlanner(1)">›</button><button class="btn small" onclick="plannerToday()">Heute</button></div><div class="date-tools"><button class="btn small" onclick="zoomPlanner(-.12)">−</button><span class="tiny muted">Zoom</span><button class="btn small" onclick="zoomPlanner(.12)">+</button><button class="btn primary small" onclick="autoSchedule()">Automatisch planen</button></div></div><div class="legend"><span><i style="background:#d97706"></i>Rüstzeit</span><span><i style="background:#2563eb"></i>Laufzeit</span><span><i style="background:#ef4444"></i>rote Umrandung = Terminrisiko</span><span>Balken antippen zum Bearbeiten · am PC per Drag & Drop verschieben</span></div>${unplanned.length?`<div class="section-head" style="margin-top:4px"><h2>Ungeplant (${unplanned.length})</h2><span class="tiny muted">Automatische Planung ordnet Maschine und Startzeit zu</span></div><div class="unplanned">${unplannedHtml}</div>`:''}<div class="timeline-shell"><div class="timeline-scroll"><div class="tl-header"><div class="tl-left">Maschine / Auslastung</div><div class="axis" style="width:${width}px">${axis}</div></div>${rows}</div></div><div class="planner-summary">${summaries}</div>`}
function barHTML(j,base,total,ppm){let a=dateToIndex(parseDT(j.start),base),b=a+duration(j);if(b<=0||a>=total)return'';let visibleA=Math.max(0,a),visibleB=Math.min(total,b),left=visibleA*ppm,w=Math.max(18,(visibleB-visibleA)*ppm),setupPct=Math.min(100,Math.max(0,j.setup/duration(j)*100));return `<div class="bar ${isLate(j)?'late':''}" draggable="true" data-id="${j.id}" ondragstart="dragStart(event,'${j.id}')" onclick="openOrder('${j.id}')" style="left:${left}px;width:${w}px"><div class="bar-fill"><span class="bar-setup" style="width:${setupPct}%"></span><span class="bar-run"></span></div><div class="bar-text"><b>${j.id} · ${j.name}</b><small>${pad(parseDT(j.start).getHours())}:${pad(parseDT(j.start).getMinutes())} · ${fmtMin(duration(j))} · ${j.qty} Stk.</small></div></div>`}
function setPlannerMode(m){plannerMode=m;renderPlanner()}
function shiftPlanner(dir){anchor=addDays(anchor,dir*(plannerMode==='week'?7:1));if(anchor.getDay()===0)anchor=addDays(anchor,dir>0?1:-2);if(anchor.getDay()===6)anchor=addDays(anchor,dir>0?2:-1);renderPlanner()}
function plannerToday(){anchor=new Date();renderPlanner()}
function zoomPlanner(v){zoom=Math.min(1.4,Math.max(.3,zoom+v));renderPlanner()}
function dragStart(e,id){dragId=id;e.dataTransfer.effectAllowed='move';e.stopPropagation()}
function trackOver(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function trackLeave(e){e.currentTarget.classList.remove('dragover')}
function dropJob(e,mid){e.preventDefault();e.currentTarget.classList.remove('dragover');if(!dragId)return;let rect=e.currentTarget.getBoundingClientRect(),width=plannerWidth(),total=plannerDays()*shiftMinutes(),x=e.clientX-rect.left,idx=x/width*total,snap=state.settings.snap||15;idx=Math.round(idx/snap)*snap;idx=Math.max(0,idx);let j=state.jobs.find(x=>x.id===dragId);j.m=mid;j.start=localDT(indexToDate(idx,plannerBase()));j.status=j.status==='unplanned'?'planned':j.status;dragId='';save();renderPlanner()}
function autoSchedule(){let jobs=state.jobs.filter(j=>j.status!=='done');jobs.filter(j=>!j.m).forEach(j=>j.m=suggestMachine(j));let baseStart=normalizeWork(new Date());if(plannerMode==='week'){let wb=plannerBase();wb.setHours(state.settings.shiftStart,0,0,0);if(wb>baseStart)baseStart=wb}MACHINES.forEach(m=>{let q=jobs.filter(j=>j.m===m.id).sort((a,b)=>a.due.localeCompare(b.due)||priorityRank(a.priority)-priorityRank(b.priority));let cursor=new Date(baseStart);q.forEach(j=>{j.start=localDT(cursor);j.status=j.status==='unplanned'?'planned':j.status;cursor=addBusinessMinutes(cursor,duration(j))})});save();renderPlanner()}
function renderOrders(){let rows=[...state.jobs].sort((a,b)=>a.due.localeCompare(b.due)).map(j=>`<tr onclick="openOrder('${j.id}')"><td><b>${j.id}</b></td><td>${j.article||'—'}</td><td>${j.name}</td><td>${j.type}</td><td>${j.qty}</td><td>${machine(j.m)?.name||'offen'}</td><td>${fmtDT(j.start)}</td><td>${fmtMin(duration(j))}</td><td>${fmtDate(j.due)}</td><td><span class="badge ${isLate(j)?'red':badgeClass(j.status)}">${isLate(j)?'Terminrisiko':statusText(j.status)}</span></td></tr>`).join('');root.innerHTML=`<div class="toolbar"><input class="search" id="searchOrders" placeholder="Auftrag, Artikel, Maschine suchen…"><div><button class="btn" onclick="autoSchedule();showView('planner')">Automatisch planen</button> <button class="btn primary" onclick="openNewOrder()">+ Auftrag</button></div></div><div class="tablewrap"><table class="orders-table"><thead><tr><th>Auftrag</th><th>Artikel</th><th>Bezeichnung</th><th>Bearbeitung</th><th>Stk.</th><th>Maschine</th><th>Start</th><th>Dauer</th><th>Termin</th><th>Status</th></tr></thead><tbody id="orderRows">${rows}</tbody></table></div>`;$('#searchOrders').oninput=e=>document.querySelectorAll('#orderRows tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')}
function renderTablet(){let q=state.jobs.filter(j=>j.m===selectedMachine&&j.status!=='done').sort((a,b)=>(a.start||'9').localeCompare(b.start||'9'));let j=q.find(x=>['running','setup','paused'].includes(x.status))||q[0],m=machine(selectedMachine);root.innerHTML=`<div class="tablet-wrap"><div class="machine-tabs">${MACHINES.map(x=>`<button class="btn ${x.id===selectedMachine?'primary':''}" onclick="selectedMachine='${x.id}';renderTablet()">${x.name}</button>`).join('')}</div>${j?`<div class="hero"><span class="tiny">${m.name} · ${fmtDT(j.start)}</span><h2>${j.id} · ${j.name}</h2><span class="badge ${badgeClass(j.status)}">${statusText(j.status)}</span></div><div class="tablet-grid"><section class="panel"><div class="info-grid"><div class="info"><small>Bearbeitung</small><b>${j.type}</b></div><div class="info"><small>Material</small><b>${j.material||'—'}</b></div><div class="info"><small>Programm</small><b>${j.program||'—'}</b></div><div class="info"><small>Rüst- / Laufzeit</small><b>${j.setup} min / ${j.cycle} min je Stk.</b></div></div><div class="shop-actions"><button class="btn" onclick="setStatus('${j.id}','setup')">Rüsten starten</button><button class="btn primary" onclick="setStatus('${j.id}','running')">Produktion starten</button><button class="btn" onclick="setStatus('${j.id}','paused')">Pause</button><button class="btn success" onclick="finishJob('${j.id}')">Arbeitsgang fertig</button></div></section><aside class="panel"><span class="tiny muted">Gutteile</span><div class="qty">${j.good}/${j.qty}</div><button class="btn primary" style="width:100%;margin:8px 0" onclick="plusGood('${j.id}')">+1 Gutteil</button><h2 style="margin-top:14px">Danach</h2>${q.filter(x=>x.id!==j.id).slice(0,4).map(x=>`<div class="list-row" onclick="openOrder('${x.id}')"><div><b>${x.id}</b><small>${x.name} · ${fmtDT(x.start)}</small></div></div>`).join('')||'<div class="empty">Keine weiteren Aufträge</div>'}</aside></div>`:`<div class="hero"><span class="tiny">${m.name}</span><h2>Maschine frei</h2></div><div class="empty">Keine offenen Arbeitsgänge eingeplant.</div>`}</div>`}
function setStatus(id,s){let j=state.jobs.find(x=>x.id===id);j.status=s;save();renderTablet()}
function plusGood(id){let j=state.jobs.find(x=>x.id===id);j.good=Math.min(j.qty,(j.good||0)+1);if(j.good>=j.qty)j.status='done';save();renderTablet()}
function finishJob(id){let j=state.jobs.find(x=>x.id===id);j.good=j.qty;j.status='done';save();renderTablet()}
function renderSettings(){root.innerHTML=`<div class="settings-grid"><section class="settings-card"><h2>Arbeitszeit / Planung</h2><div class="field"><label>Schichtbeginn</label><input id="shiftStart" type="number" min="0" max="23" value="${state.settings.shiftStart}"></div><div class="field"><label>Schichtende</label><input id="shiftEnd" type="number" min="1" max="24" value="${state.settings.shiftEnd}"></div><div class="field"><label>Planungsraster in Minuten</label><select id="snap"><option ${state.settings.snap===5?'selected':''}>5</option><option ${state.settings.snap===10?'selected':''}>10</option><option ${state.settings.snap===15?'selected':''}>15</option><option ${state.settings.snap===30?'selected':''}>30</option></select></div><button class="btn primary" onclick="saveSettings()">Einstellungen speichern</button><p class="hint">Im Test wird Montag bis Freitag geplant. Pausen und Schichtkalender können wir später separat hinterlegen.</p></section><section class="settings-card"><h2>Daten / Sicherung</h2><p class="muted tiny">Den aktuellen privaten Teststand kannst du als JSON sichern.</p><button class="btn" onclick="exportBackup()">Backup herunterladen</button> <button class="btn danger" onclick="resetDemo()">Demo zurücksetzen</button><p class="hint">Für den späteren Firmeneinsatz ersetzen wir Browser-Speicher durch eine gemeinsame Datenquelle.</p></section></div>`}
function saveSettings(){let a=+$('#shiftStart').value,b=+$('#shiftEnd').value;if(b<=a){alert('Schichtende muss nach dem Schichtbeginn liegen.');return}state.settings.shiftStart=a;state.settings.shiftEnd=b;state.settings.snap=+$('#snap').value;save();renderSettings()}
function openOrder(id){let j=state.jobs.find(x=>x.id===id),f=finishDate(j);openModal(`<div class="modal-head"><div><b>${j.id} · ${j.name}</b><div class="tiny muted">${j.article||'kein Artikel'} · ${j.qty} Stück · ${j.material||'Material offen'}</div></div><button class="close" onclick="closeModal()">×</button></div><form class="modal-body" onsubmit="saveOrderEdit(event,'${j.id}')"><div class="form-grid"><div class="field"><label>Maschine</label><select name="m"><option value="">ungeplant</option>${MACHINES.map(m=>`<option value="${m.id}" ${m.id===j.m?'selected':''}>${m.name}</option>`).join('')}</select></div><div class="field"><label>Startzeit</label><input name="start" type="datetime-local" value="${j.start}"></div><div class="field"><label>Liefertermin</label><input name="due" type="date" value="${j.due}"></div><div class="field"><label>Priorität</label><select name="priority"><option value="high" ${j.priority==='high'?'selected':''}>Hoch</option><option value="medium" ${j.priority==='medium'?'selected':''}>Mittel</option><option value="low" ${j.priority==='low'?'selected':''}>Niedrig</option></select></div><div class="field"><label>Rüstzeit min</label><input name="setup" type="number" min="0" value="${j.setup}"></div><div class="field"><label>Laufzeit min/Stk.</label><input name="cycle" type="number" step="0.1" min="0" value="${j.cycle}"></div><div class="field"><label>Stückzahl</label><input name="qty" type="number" min="1" value="${j.qty}"></div><div class="field"><label>Bearbeitung</label><input name="type" value="${j.type}"></div><div class="field full"><label>NC-Programm</label><input name="program" value="${j.program||''}"></div></div><div style="margin-top:10px" class="info-grid"><div class="info"><small>Berechnete Dauer</small><b>${fmtMin(duration(j))}</b></div><div class="info"><small>Geplantes Ende</small><b>${f?fmtDT(localDT(f)):'noch ungeplant'}</b></div></div>${isLate(j)?'<p class="badge red" style="margin-top:10px">Terminrisiko: geplantes Ende liegt nach dem Liefertermin</p>':''}<div class="modal-actions"><button type="button" class="btn danger" onclick="deleteOrder('${j.id}')">Löschen</button><button type="button" class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary">Speichern</button></div></form>`)}
function saveOrderEdit(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),j=state.jobs.find(x=>x.id===id);j.m=f.m;j.start=f.start;j.due=f.due;j.priority=f.priority;j.setup=+f.setup;j.cycle=+f.cycle;j.qty=+f.qty;j.type=f.type;j.program=f.program;j.status=j.m&&j.start?(j.status==='unplanned'?'planned':j.status):'unplanned';save();closeModal();render()}
function openNewOrder(){let suggested=normalizeWork(new Date());openModal(`<div class="modal-head"><b>Fertigungsauftrag anlegen</b><button class="close" onclick="closeModal()">×</button></div><form class="modal-body" onsubmit="createOrder(event)"><div class="form-grid"><div class="field"><label>Auftragsnummer</label><input name="id" required placeholder="FA-260300"></div><div class="field"><label>Artikelnummer</label><input name="article" placeholder="A-30010"></div><div class="field full"><label>Bezeichnung</label><input name="name" required placeholder="z. B. Lagerbock"></div><div class="field"><label>Bearbeitung</label><select name="type"><option>5-Achs</option><option>3-Achs</option><option>Drehen</option><option>Dreh-Fräsen</option><option selected>Fräsen</option></select></div><div class="field"><label>Stückzahl</label><input name="qty" type="number" min="1" value="10"></div><div class="field"><label>Rüstzeit min</label><input name="setup" type="number" min="0" value="30"></div><div class="field"><label>Laufzeit min/Stk.</label><input name="cycle" type="number" min="0" step="0.1" value="6"></div><div class="field"><label>Liefertermin</label><input name="due" type="date" value="${dateISO(addDays(new Date(),7))}"></div><div class="field"><label>Maschine</label><select name="m"><option value="">Automatisch / offen</option>${MACHINES.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div><div class="field"><label>Startzeit optional</label><input name="start" type="datetime-local" value=""></div><div class="field"><label>Priorität</label><select name="priority"><option value="medium">Mittel</option><option value="high">Hoch</option><option value="low">Niedrig</option></select></div><div class="field"><label>Material</label><input name="material"></div><div class="field full"><label>NC-Programm</label><input name="program"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary">Auftrag speichern</button></div></form>`)}
function createOrder(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(state.jobs.some(j=>j.id===f.id)){alert('Diese Auftragsnummer existiert bereits.');return}state.jobs.push({id:f.id,article:f.article,name:f.name,type:f.type,qty:+f.qty,due:f.due,m:f.m,setup:+f.setup,cycle:+f.cycle,status:f.m&&f.start?'planned':'unplanned',good:0,priority:f.priority,start:f.start,material:f.material,program:f.program});save();closeModal();showView('planner')}
function deleteOrder(id){if(confirm(id+' wirklich löschen?')){state.jobs=state.jobs.filter(j=>j.id!==id);save();closeModal();render()}}
function openModal(html){$('#modal').innerHTML=html;$('#backdrop').classList.remove('hidden')}
function closeModal(){$('#backdrop').classList.add('hidden')}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zerspanung-control-backup-'+dateISO(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetDemo(){if(confirm('Alle Teständerungen wirklich zurücksetzen?')){state=seedState();save();render()}}
window.showView=showView;window.openNewOrder=openNewOrder;window.openOrder=openOrder;window.closeModal=closeModal;window.createOrder=createOrder;window.saveOrderEdit=saveOrderEdit;window.deleteOrder=deleteOrder;window.setPlannerMode=setPlannerMode;window.shiftPlanner=shiftPlanner;window.plannerToday=plannerToday;window.zoomPlanner=zoomPlanner;window.dragStart=dragStart;window.trackOver=trackOver;window.trackLeave=trackLeave;window.dropJob=dropJob;window.autoSchedule=autoSchedule;window.renderTablet=renderTablet;window.setStatus=setStatus;window.plusGood=plusGood;window.finishJob=finishJob;window.saveSettings=saveSettings;window.exportBackup=exportBackup;window.resetDemo=resetDemo;
save();render();
</script>
