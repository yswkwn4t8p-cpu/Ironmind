<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Zerspanung Control</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#172033}*{box-sizing:border-box}header{background:#111827;color:#fff;padding:16px 18px;position:sticky;top:0;z-index:3}header b{font-size:19px}header small{display:block;color:#9fb0c8;margin-top:3px}.nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:70px;z-index:2}.nav button,.btn{border:1px solid #dfe5ee;background:#fff;border-radius:9px;padding:9px 11px;font-weight:700;white-space:nowrap}.nav button.on,.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.wrap{padding:14px;max-width:1200px;margin:auto}.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:12px;padding:13px;margin-bottom:10px}.card h3{margin:0 0 5px;font-size:14px}.muted{color:#667085;font-size:11px}.big{font-size:28px;font-weight:900;margin:5px 0}.badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800;background:#eef2f7}.green{background:#eaf8ef;color:#106a31}.blue{background:#eaf1ff;color:#174ea6}.orange{background:#fff4e5;color:#9a5700}.red{background:#fff0f0;color:#a61b1b}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.row b{font-size:12px}.row small{display:block;color:#667085}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.machine{min-height:140px}.planner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.job{border:1px solid #dfe5ee;border-left:4px solid #2563eb;border-radius:9px;padding:9px;margin-top:8px}.job.high{border-left-color:#dc2626}.job b{font-size:11px}.job small{display:block;color:#667085}.input{width:100%;padding:9px;border:1px solid #dfe5ee;border-radius:8px;margin:5px 0 9px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid,.planner{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:520px){.grid,.planner{grid-template-columns:1fr}.nav{top:74px}.wrap{padding:10px}}</style></head><body><header><b>Zerspanung Control</b><small>Privater Test · Browser-Version</small></header><div class="nav" id="nav"></div><main class="wrap"><div class="note"><b>Testmodus:</b> Daten werden nur in diesem Browser gespeichert. Noch keine vertraulichen Firmendaten verwenden.</div><div id="app"></div></main><script>const M=[['M01','Haas 5-Achs'],['M02','Haas 3-Achs'],['M03','Kern Drehen'],['M04','Haas Y-Achs']];const seed=[{id:'FA-260184',name:'Welle Antrieb',qty:10,due:'21.09.',m:'M04',setup:30,cycle:7,status:'planned',good:0,p:'high'},{id:'FA-260191',name:'Halter Sensor',qty:8,due:'22.09.',m:'M01',setup:35,cycle:11,status:'planned',good:0,p:'medium'},{id:'FA-260205',name:'Distanzplatte',qty:20,due:'24.09.',m:'M02',setup:20,cycle:4,status:'planned',good:0,p:'medium'},{id:'FA-260211',name:'Bolzen Präzision',qty:12,due:'25.09.',m:'M03',setup:25,cycle:5.5,status:'planned',good:0,p:'low'},{id:'FA-260219',name:'Aufnahmeblock',qty:6,due:'23.09.',m:'',setup:30,cycle:12,status:'unplanned',good:0,p:'high'}];let jobs=JSON.parse(localStorage.getItem('zcprod')||'null')||seed,view='dash';const A=document.getElementById('app'),N=document.getElementById('nav');const tabs=[['dash','Dashboard'],['plan','Planung'],['orders','Aufträge'],['tablet','Maschine'],['new','+ Auftrag']];function save(){localStorage.setItem('zcprod',JSON.stringify(jobs))}function mach(id){return (M.find(x=>x[0]===id)||['','Offen'])[1]}function badge(s){return s==='running'?'green':s==='setup'||s==='paused'?'orange':s==='planned'?'blue':s==='done'?'green':'red'}function stat(s){return({planned:'Geplant',running:'Läuft',setup:'Rüsten',paused:'Pause',done:'Fertig',unplanned:'Ungeplant'})[s]||s}function nav(){N.innerHTML=tabs.map(t=>`<button class="${view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}function go(v){view=v;nav();render()}function render(){if(view==='dash')dash();if(view==='plan')plan();if(view==='orders')orders();if(view==='tablet')tablet();if(view==='new')form()}function dash(){let open=jobs.filter(j=>j.status!=='done'),active=jobs.filter(j=>j.status==='running').length,unp=jobs.filter(j=>!j.m&&j.status!=='done').length;A.innerHTML=`<div class="grid"><div class="card"><span class="muted">Offene Aufträge</span><div class="big">${open.length}</div></div><div class="card"><span class="muted">Maschinen aktiv</span><div class="big">${active}</div></div><div class="card"><span class="muted">Ungeplant</span><div class="big">${unp}</div></div><div class="card"><span class="muted">Gesamtstücke offen</span><div class="big">${open.reduce((s,j)=>s+j.qty-j.good,0)}</div></div></div><h3>Maschinenstatus</h3><div class="grid">${M.map(m=>{let j=jobs.find(x=>x.m===m[0]&&x.status!=='done');return `<div class="card machine"><h3>${m[1]}</h3>${j?`<div class="row"><div><b>${j.id}</b><small>${j.name}</small></div><span class="badge ${badge(j.status)}">${stat(j.status)}</span></div><small>${j.good}/${j.qty} Gutteile</small>`:'<div class="muted">Maschine frei</div>'}</div>`}).join('')}</div>`}function plan(){A.innerHTML=`<div class="toolbar"><button class="btn" onclick="auto()">Ungeplante automatisch zuordnen</button></div><div class="planner">${M.map(m=>`<div class="card"><h3>${m[1]}</h3>${jobs.filter(j=>j.m===m[0]&&j.status!=='done').map(j=>`<div class="job ${j.p==='high'?'high':''}"><b>${j.id} · ${j.name}</b><small>${j.qty} Stk. · Rüst ${j.setup} min · ${j.cycle} min/Stk.</small><div class="actions" style="margin-top:7px"><button class="btn" onclick="move('${j.id}','')">Entplanen</button></div></div>`).join('')||'<div class="muted">Keine Aufträge</div>'}</div>`).join('')}</div><h3>Ungeplant</h3>${jobs.filter(j=>!j.m&&j.status!=='done').map(j=>`<div class="card"><b>${j.id} · ${j.name}</b><div class="actions" style="margin-top:8px">${M.map(m=>`<button class="btn" onclick="move('${j.id}','${m[0]}')">${m[1]}</button>`).join('')}</div></div>`).join('')||'<div class="card muted">Alles eingeplant.</div>'}`}function orders(){A.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="go('new')">+ Auftrag</button><button class="btn" onclick="reset()">Demo zurücksetzen</button></div>${jobs.map(j=>`<div class="card"><div class="row"><div><b>${j.id} · ${j.name}</b><small>${mach(j.m)} · Termin ${j.due} · ${j.qty} Stk.</small></div><span class="badge ${badge(j.status)}">${stat(j.status)}</span></div><div class="actions"><button class="btn" onclick="del('${j.id}')">Löschen</button></div></div>`).join('')}`}function tablet(){let opts=M.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('');A.innerHTML=`<div class="card"><h3>Maschinenansicht</h3><select class="input" id="sel" onchange="showMachine(this.value)">${opts}</select><div id="machine"></div></div>`;showMachine(M[0][0])}function showMachine(mid){let j=jobs.find(x=>x.m===mid&&x.status!=='done'),el=document.getElementById('machine');if(!j){el.innerHTML='<div class="muted">Keine Arbeit eingeplant.</div>';return}el.innerHTML=`<h2>${j.id} · ${j.name}</h2><p>${j.good}/${j.qty} Gutteile · Rüst ${j.setup} min · ${j.cycle} min/Stk.</p><div class="actions"><button class="btn" onclick="setS('${j.id}','setup','${mid}')">Rüsten</button><button class="btn primary" onclick="setS('${j.id}','running','${mid}')">Produktion</button><button class="btn" onclick="plus('${j.id}','${mid}')">+1 Gutteil</button><button class="btn" onclick="setS('${j.id}','paused','${mid}')">Pause</button><button class="btn" onclick="finish('${j.id}','${mid}')">Fertig</button></div><p><span class="badge ${badge(j.status)}">${stat(j.status)}</span></p>`}function form(){A.innerHTML=`<form class="card" onsubmit="add(event)"><h3>Fertigungsauftrag anlegen</h3><div class="form"><label>Auftragsnummer<input class="input" name="id" required placeholder="FA-260300"></label><label>Bezeichnung<input class="input" name="name" required></label><label>Stückzahl<input class="input" name="qty" type="number" min="1" value="10"></label><label>Liefertermin<input class="input" name="due" placeholder="30.09."></label><label>Rüstzeit min<input class="input" name="setup" type="number" value="20"></label><label>Laufzeit min/Stk.<input class="input" name="cycle" type="number" step="0.1" value="5"></label><label class="full">Maschine<select class="input" name="m"><option value="">offen</option>${M.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('')}</select></label></div><button class="btn primary">Speichern</button></form>`}function add(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));jobs.push({id:f.id,name:f.name,qty:+f.qty,due:f.due,m:f.m,setup:+f.setup,cycle:+f.cycle,status:f.m?'planned':'unplanned',good:0,p:'medium'});save();go('orders')}function move(id,m){let j=jobs.find(x=>x.id===id);j.m=m;j.status=m?'planned':'unplanned';save();plan()}function auto(){jobs.filter(j=>!j.m&&j.status!=='done').forEach((j,i)=>{j.m=M[i%4][0];j.status='planned'});save();plan()}function setS(id,s,mid){let j=jobs.find(x=>x.id===id);j.status=s;save();showMachine(mid)}function plus(id,mid){let j=jobs.find(x=>x.id===id);j.good=Math.min(j.qty,j.good+1);if(j.good>=j.qty)j.status='done';save();showMachine(mid)}function finish(id,mid){let j=jobs.find(x=>x.id===id);j.good=j.qty;j.status='done';save();showMachine(mid)}function del(id){if(confirm(id+' löschen?')){jobs=jobs.filter(x=>x.id!==id);save();orders()}}function reset(){if(confirm('Testdaten zurücksetzen?')){jobs=JSON.parse(JSON.stringify(seed));save();orders()}}window.go=go;window.move=move;window.auto=auto;window.showMachine=showMachine;window.setS=setS;window.plus=plus;window.finish=finish;window.del=del;window.reset=reset;window.add=add;nav();render();</script></body></html>
